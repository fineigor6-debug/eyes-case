<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYTHIC Case</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>

.case-screen{
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
padding:20px;
}

.case-area{
position:relative;
height:120px;
display:flex;
align-items:center;
justify-content:center;
}

.case-open{
transition:0.5s;
}

.case-open.active{
transform:scale(1.4);
opacity:0;
}

.roulette-container{
position:absolute;
width:100%;
max-width:350px;
overflow:hidden;
border:2px solid #333;
border-radius:10px;
background:#111;
height:90px;
display:none;
}

.pointer{
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
font-size:20px;
color:red;
z-index:5;
}

.roulette{
display:flex;
gap:10px;
padding:10px;
transition:4s cubic-bezier(.1,.7,.1,1);
}

.item{
min-width:70px;
height:70px;
background:#1a1a1a;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
border:1px solid #333;
}

.case-items{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:10px;
}

.case-item{
background:#141414;
border-radius:8px;
padding:8px;
font-size:12px;
text-align:center;
border:1px solid #333;
}

.win-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:0.3s;
}

.win-popup.active{
opacity:1;
pointer-events:auto;
}

.win-box{
background:#111;
border-radius:14px;
padding:30px;
text-align:center;
border:1px solid #333;
}

.win-item{
font-size:18px;
margin:15px 0;
color:#ff2b2b;
font-family:'Orbitron';
}

.open-btn:disabled{
opacity:0.5;
cursor:not-allowed;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

<button class="back-btn" onclick="goBack()">←</button>

<div class="username">
MYTHIC CASE
</div>

</div>

<div class="case-screen">

<div class="case-area">

<img id="caseImg" src="../CasesPhoto/image.png" class="case-img case-open">

<div class="roulette-container" id="rouletteContainer">

<div class="pointer">▼</div>

<div class="roulette" id="roulette"></div>

</div>

</div>

<div class="case-title">
MYTHIC
</div>

<button class="open-btn" id="openBtn" onclick="openCase()">
Открыть кейс
</button>

<div class="case-items">

<div class="case-item">NFT DEVIL</div>
<div class="case-item">NFT DEMON</div>
<div class="case-item">NFT DRAGON</div>
<div class="case-item">NFT EYES</div>
<div class="case-item">NFT SHADOW</div>
<div class="case-item">NFT DARK</div>
<div class="case-item">NFT BLOOD</div>
<div class="case-item">NFT KING</div>

</div>

</div>

</div>

<div class="win-popup" id="winPopup">

<div class="win-box">

<div>🎉 Вам выпало</div>

<div class="win-item" id="winItem">
NFT
</div>

<button class="open-btn" onclick="closeWin()">
Забрать
</button>

</div>

</div>

<script>

const tg = window.Telegram.WebApp
tg.expand()

function goBack(){
window.location.href="../index.html"
}

const items = [
"DEVIL",
"DEMON",
"DRAGON",
"EYES",
"SHADOW",
"DARK",
"BLOOD",
"KING"
]

let spinning = false

function openCase(){

if(spinning) return

spinning = true

const caseImg = document.getElementById("caseImg")
const roulette = document.getElementById("roulette")
const container = document.getElementById("rouletteContainer")
const btn = document.getElementById("openBtn")

btn.disabled = true

caseImg.classList.add("active")

setTimeout(()=>{

container.style.display="block"

roulette.innerHTML=""
roulette.style.transform="translateX(0px)"

for(let i=0;i<50;i++){

const item = document.createElement("div")
item.className="item"

const rand = items[Math.floor(Math.random()*items.length)]

item.innerText=rand

roulette.appendChild(item)

}

const winIndex = 35 + Math.floor(Math.random()*5)

const offset = winIndex * 80

setTimeout(()=>{
roulette.style.transform="translateX(-"+offset+"px)"
},100)

setTimeout(()=>{

const winItem = roulette.children[winIndex].innerText

document.getElementById("winItem").innerText = winItem

document.getElementById("winPopup").classList.add("active")

},4200)

},500)

}

function closeWin(){

document.getElementById("winPopup").classList.remove("active")

const caseImg = document.getElementById("caseImg")
const roulette = document.getElementById("roulette")
const container = document.getElementById("rouletteContainer")
const btn = document.getElementById("openBtn")

caseImg.classList.remove("active")

container.style.display="none"

roulette.innerHTML=""

btn.disabled = false

spinning = false

}

</script>

</body>
</html>
