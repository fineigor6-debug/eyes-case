<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYTHIC Case</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>

body{
background:#0b0b0b;
font-family:'Orbitron',sans-serif;
}

/* SCREEN */

.case-screen{
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
padding:20px;
}

/* CASE */

.case-area{
position:relative;
height:120px;
display:flex;
align-items:center;
justify-content:center;
}

.case-open{
transition:0.5s;
}

.case-open.active{
transform:scale(1.4);
opacity:0;
}

/* ROULETTE */

.roulette-container{
position:absolute;
width:100%;
max-width:350px;
overflow:hidden;
border:2px solid #2a0000;
border-radius:10px;
background:#111;
height:90px;
display:none;
box-shadow:0 0 15px rgba(255,0,0,0.25);
}

.pointer{
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
font-size:20px;
color:#ff2b2b;
z-index:5;
}

.roulette{
display:flex;
gap:10px;
padding:10px;
transition:4s cubic-bezier(.1,.7,.1,1);
}

.item{
min-width:70px;
max-width:70px;
height:70px;
background:#1a0000;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,0,0,0.25);
box-shadow:0 0 6px rgba(255,0,0,0.2);
}

.item img{
width:55px;
filter:drop-shadow(0 0 5px rgba(255,0,0,0.6));
}

.ton-icon{
width:40px;
height:40px;
filter:drop-shadow(0 0 6px red);
}

/* NFT GRID */

.case-items{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
margin-top:10px;
width:100%;
max-width:350px;
}

.case-item{
background:linear-gradient(180deg,#1a0000,#0f0f0f);
border-radius:14px;
border:1px solid rgba(255,0,0,0.25);
overflow:hidden;
display:flex;
flex-direction:column;
align-items:center;
position:relative;

box-shadow:
0 0 12px rgba(255,0,0,0.15),
inset 0 0 8px rgba(255,0,0,0.1);
}

.case-item-img{
padding:14px;
display:flex;
justify-content:center;
align-items:center;
height:95px;
width:100%;
background:linear-gradient(180deg,#1b0000,#141414);
}

.case-item-img img{
width:70px;
}

.case-item-name{
width:100%;
background:linear-gradient(180deg,#1c0000,#1a1a1a);
font-size:11px;
padding:6px 4px;
text-align:center;
border-top:1px solid rgba(255,0,0,0.25);
color:#f2f2f2;
}

/* WIN POPUP */

.win-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:0.3s;
}

.win-popup.active{
opacity:1;
pointer-events:auto;
}

.win-box{
background:#111;
border-radius:14px;
padding:30px;
text-align:center;
border:1px solid rgba(255,0,0,0.4);
box-shadow:0 0 20px rgba(255,0,0,0.4);
}

.win-item img{
width:90px;
margin:10px 0;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

<button class="back-btn" onclick="goBack()">←</button>

<div class="username">
MYTHIC CASE
</div>

</div>

<div class="case-screen">

<div class="case-area">

<img id="caseImg" src="../CasesPhoto/image.png" class="case-img case-open">

<div class="roulette-container" id="rouletteContainer">

<div class="pointer">▼</div>

<div class="roulette" id="roulette"></div>

</div>

</div>

<div class="case-title">
MYTHIC
</div>

<button class="open-btn" id="openBtn" onclick="openCase()">
Открыть кейс • 25
</button>

<div class="case-items">

<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Big-Year.png"></div><div class="case-item-name">Big Year</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Clover-Pin.png"></div><div class="case-item-name">Clover Pin</div></div>

<div class="case-item">
<div class="case-item-img">
<svg class="ton-icon" viewBox="0 0 56 56">
<path fill="red" d="M28 4L8 16l20 36 20-36L28 4z"/>
</svg>
</div>
<div class="case-item-name">4 TON</div>
</div>

<div class="case-item">
<div class="case-item-img">
<svg class="ton-icon" viewBox="0 0 56 56">
<path fill="red" d="M28 4L8 16l20 36 20-36L28 4z"/>
</svg>
</div>
<div class="case-item-name">1.5 TON</div>
</div>

</div>

</div>

</div>

<div class="win-popup" id="winPopup">

<div class="win-box">

<div>🎉 Вам выпало</div>

<div class="win-item" id="winItem"></div>

<button class="open-btn" onclick="closeWin()">Забрать</button>

</div>

</div>

<script src="../app/app.js"></script>

<script>

const tg = window.Telegram.WebApp
tg.expand()

function goBack(){

if(spinning){
showNotice("Кейс уже открывается")
return
}

window.location.href="../index.html"

}

const items=[

{name:"Big Year",img:"../nft/eyes-mythic-drop/Big-Year.png"},
{name:"Clover Pin",img:"../nft/eyes-mythic-drop/Clover-Pin.png"},

{name:"4 TON",ton:4},
{name:"1.5 TON",ton:1.5}

]

const casePrice=25
let spinning=false

function openCase(){

if(spinning) return
if(!payForCase(casePrice)) return

spinning=true

const roulette=document.getElementById("roulette")
const container=document.getElementById("rouletteContainer")

container.style.display="block"
roulette.innerHTML=""

for(let i=0;i<50;i++){

const rand=items[Math.floor(Math.random()*items.length)]

const item=document.createElement("div")
item.className="item"

if(rand.ton){

item.innerHTML=`<svg class="ton-icon" viewBox="0 0 56 56">
<path fill="red" d="M28 4L8 16l20 36 20-36L28 4z"/>
</svg>`

item.dataset.ton=rand.ton

}else{

item.innerHTML=`<img src="${rand.img}">`
item.dataset.img=rand.img
}

item.dataset.name=rand.name
roulette.appendChild(item)

}

const winIndex=35+Math.floor(Math.random()*5)
const offset=winIndex*80

setTimeout(()=>{
roulette.style.transform="translateX(-"+offset+"px)"
},100)

setTimeout(()=>{

const winItem=roulette.children[winIndex]

if(winItem.dataset.ton){

addBalance(parseFloat(winItem.dataset.ton))

document.getElementById("winItem").innerHTML=
`<svg class="ton-icon" viewBox="0 0 56 56">
<path fill="red" d="M28 4L8 16l20 36 20-36L28 4z"/>
</svg><br>${winItem.dataset.ton} TON`

}else{

document.getElementById("winItem").innerHTML=
`<img src="${winItem.dataset.img}"><br>${winItem.dataset.name}`

}

document.getElementById("winPopup").classList.add("active")

},4200)

}

function closeWin(){

document.getElementById("winPopup").classList.remove("active")

document.getElementById("roulette").innerHTML=""

document.getElementById("rouletteContainer").style.display="none"

spinning=false

}

</script>

</body>
</html>
