<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYTHIC Case</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>

/* экран кейса */

.case-screen{
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
padding:20px;
}

/* анимация кейса */

.case-open{
transition:0.4s;
}

.case-open.active{
transform:scale(1.3);
filter:brightness(1.5);
}

/* рулетка */

.roulette-container{
width:100%;
max-width:350px;
overflow:hidden;
border:2px solid #333;
border-radius:10px;
background:#111;
height:90px;
display:none;
}

.roulette{
display:flex;
gap:10px;
padding:10px;
transition:3s cubic-bezier(.1,.7,.1,1);
}

.item{
min-width:70px;
height:70px;
background:#1a1a1a;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
border:1px solid #333;
}

/* выпадение */

.win{
border:2px solid red;
}

/* дроп кейса */

.case-items{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:10px;
}

.case-item{
background:#141414;
border-radius:8px;
padding:8px;
font-size:12px;
text-align:center;
border:1px solid #333;
}

</style>

</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<button class="back-btn" onclick="goBack()">←</button>

<div class="username">
MYTHIC CASE
</div>

</div>

<div class="case-screen">

<img id="caseImg" src="../CasesPhoto/image.png" class="case-img case-open">

<div class="case-title">
MYTHIC
</div>

<button class="open-btn" onclick="openCase()">
Открыть кейс
</button>

<!-- рулетка -->

<div class="roulette-container" id="rouletteContainer">

<div class="roulette" id="roulette"></div>

</div>

<!-- содержимое кейса -->

<div class="case-items">

<div class="case-item">NFT DEVIL</div>
<div class="case-item">NFT DEMON</div>
<div class="case-item">NFT DRAGON</div>
<div class="case-item">NFT EYES</div>
<div class="case-item">NFT SHADOW</div>
<div class="case-item">NFT DARK</div>
<div class="case-item">NFT BLOOD</div>
<div class="case-item">NFT KING</div>

</div>

</div>

</div>

<script>

const tg = window.Telegram.WebApp
tg.expand()

function goBack(){
window.location.href="../index.html"
}

const items = [
"DEVIL",
"DEMON",
"DRAGON",
"EYES",
"SHADOW",
"DARK",
"BLOOD",
"KING"
]

function openCase(){

const caseImg = document.getElementById("caseImg")
const roulette = document.getElementById("roulette")
const container = document.getElementById("rouletteContainer")

/* анимация открытия */

caseImg.classList.add("active")

setTimeout(()=>{

caseImg.style.display="none"
container.style.display="block"

/* создаём рулетку */

roulette.innerHTML=""

for(let i=0;i<40;i++){

const item = document.createElement("div")
item.className="item"

const rand = items[Math.floor(Math.random()*items.length)]

item.innerText=rand

roulette.appendChild(item)

}

/* крутим */

const winIndex = 30 + Math.floor(Math.random()*5)

const offset = winIndex * 80

setTimeout(()=>{
roulette.style.transform="translateX(-"+offset+"px)"
},100)

},600)

}

</script>

</body>
</html>
