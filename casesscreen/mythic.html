<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYTHIC Case</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>

body{
background:#0b0b0b;
font-family:'Orbitron',sans-serif;
color:#fff;
}

/* SCREEN */

.case-screen{
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
padding:20px;
}

/* CASE */

.case-area{
position:relative;
height:130px;
display:flex;
align-items:center;
justify-content:center;
}

.case-open{
transition:0.5s;
}

.case-open.active{
transform:scale(1.35);
opacity:0;
}

/* ROULETTE */

.roulette-container{
position:absolute;
width:100%;
max-width:360px;
overflow:hidden;
border-radius:14px;
background:linear-gradient(180deg,#1a0000,#0f0f0f);
border:1px solid rgba(255,0,0,0.35);
height:95px;
display:none;
box-shadow:
0 0 20px rgba(255,0,0,0.35),
inset 0 0 10px rgba(255,0,0,0.15);
}

.pointer{
position:absolute;
top:-12px;
left:50%;
transform:translateX(-50%);
font-size:22px;
color:#ff2b2b;
z-index:5;
filter:drop-shadow(0 0 6px red);
}

.roulette{
display:flex;
gap:12px;
padding:12px;
transition:4s cubic-bezier(.1,.7,.1,1);
}

.item{
min-width:72px;
height:72px;
background:linear-gradient(180deg,#1b0000,#141414);
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,0,0,0.25);
box-shadow:0 0 8px rgba(255,0,0,0.25);
}

.item img{
width:56px;
filter:drop-shadow(0 0 6px rgba(255,0,0,0.6));
}

/* NFT GRID */

.case-items{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
margin-top:10px;
width:100%;
max-width:350px;
}

/* CARD */

.case-item{
background:linear-gradient(180deg,#1a0000,#0f0f0f);
border-radius:14px;
border:1px solid rgba(255,0,0,0.25);
overflow:hidden;
display:flex;
flex-direction:column;
align-items:center;
position:relative;

box-shadow:
0 0 12px rgba(255,0,0,0.15),
inset 0 0 8px rgba(255,0,0,0.1);
}

/* SHINE EFFECT */

.case-item::after{
content:"";
position:absolute;
top:0;
left:-120%;
width:60%;
height:100%;

background:linear-gradient(
120deg,
transparent,
rgba(255,255,255,0.18),
transparent
);

transform:skewX(-20deg);
animation:shine 4s linear infinite;
}

@keyframes shine{

0%{
left:-120%;
}

60%{
left:120%;
}

100%{
left:120%;
}

}

/* IMAGE AREA */

.case-item-img{
padding:14px;
display:flex;
justify-content:center;
align-items:center;
height:95px;
width:100%;
background:linear-gradient(180deg,#1b0000,#141414);
}

.case-item-img img{
width:70px;
height:auto;
filter:drop-shadow(0 0 8px rgba(255,0,0,0.6));
}

/* NAME */

.case-item-name{
width:100%;
background:linear-gradient(180deg,#1c0000,#1a1a1a);
font-size:11px;
padding:6px 4px;
text-align:center;
border-top:1px solid rgba(255,0,0,0.25);
color:#f2f2f2;
}

/* WIN POPUP */

.win-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.88);
backdrop-filter:blur(6px);
opacity:0;
pointer-events:none;
transition:0.25s;
}

.win-popup.active{
opacity:1;
pointer-events:auto;
}

/* BOX */

.win-box{
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
background:linear-gradient(180deg,#160000,#0c0c0c);
padding:32px 28px;
border-radius:18px;
border:1px solid rgba(255,0,0,0.45);
box-shadow:
0 0 40px rgba(255,0,0,0.45),
inset 0 0 15px rgba(255,0,0,0.2);
animation:popupShow .35s ease;
}

.win-title{
font-size:16px;
letter-spacing:1px;
color:#ff3b3b;
text-shadow:0 0 8px rgba(255,0,0,0.6);
}

/* WIN CARD */

.win-card{
width:160px;
display:flex;
flex-direction:column;
align-items:center;
border-radius:14px;
overflow:hidden;
background:linear-gradient(180deg,#1a0000,#101010);
border:1px solid rgba(255,0,0,0.35);
box-shadow:
0 0 30px rgba(255,0,0,0.55),
inset 0 0 10px rgba(255,0,0,0.2);
animation:itemReveal .4s ease;
}

.win-card-img{
width:100%;
height:120px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(180deg,#1b0000,#141414);
}

.win-card-img img{
width:90px;
filter:drop-shadow(0 0 12px rgba(255,0,0,0.9));
}

.win-card-name{
width:100%;
padding:8px;
font-size:12px;
text-align:center;
background:linear-gradient(180deg,#1c0000,#1a1a1a);
border-top:1px solid rgba(255,0,0,0.35);
}

/* BUTTON */

.win-btn{
margin-top:5px;
padding:10px 22px;
background:linear-gradient(180deg,#ff3b3b,#b40000);
border:none;
border-radius:10px;
font-family:'Orbitron',sans-serif;
font-size:12px;
color:white;
cursor:pointer;
box-shadow:0 0 12px rgba(255,0,0,0.7);
transition:.2s;
}

.win-btn:hover{
transform:scale(1.05);
box-shadow:0 0 18px rgba(255,0,0,1);
}

/* ANIMATIONS */

@keyframes popupShow{
0%{transform:scale(.75);opacity:0;}
100%{transform:scale(1);opacity:1;}
}

@keyframes itemReveal{
0%{transform:scale(.6);opacity:0;}
100%{transform:scale(1);opacity:1;}
}

.open-btn:disabled{
opacity:0.5;
cursor:not-allowed;
}

</style>

</head>

<body>

<div class="app">

<div class="header">
<button class="back-btn" onclick="goBack()">←</button>
<div class="username">MYTHIC CASE</div>
</div>

<div class="case-screen">

<div class="case-area">

<img id="caseImg" src="../CasesPhoto/image.png" class="case-img case-open">

<div class="roulette-container" id="rouletteContainer">
<div class="pointer">▼</div>
<div class="roulette" id="roulette"></div>
</div>

</div>

<div class="case-title">MYTHIC</div>

<button class="open-btn" id="openBtn" onclick="openCase()">
Открыть кейс • 25
</button>

<div class="case-items">

<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Big-Year.png"></div><div class="case-item-name">Big Year</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Clover-Pin.png"></div><div class="case-item-name">Clover Pin</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Diamond-Ring.png"></div><div class="case-item-name">Diamond Ring</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Evil-Eye.png"></div><div class="case-item-name">Evil Eye</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Ice-Cream.png"></div><div class="case-item-name">Ice Cream</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Input-Key.png"></div><div class="case-item-name">Input Key</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Love-Potion.png"></div><div class="case-item-name">Love Potion</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Mad-Pumpkin.png"></div><div class="case-item-name">Mad Pumpkin</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Money-Pot.png"></div><div class="case-item-name">Money Pot</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Mousse-Cake.png"></div><div class="case-item-name">Mousse Cake</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Sharp-Tongue.png"></div><div class="case-item-name">Sharp Tongue</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Sleigh-Bell.png"></div><div class="case-item-name">Sleigh Bell</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/eyes-mythic-drop/Snoop-Dogg.png"></div><div class="case-item-name">Snoop Dogg</div></div>

</div>

</div>

</div>

</body>
</html>
