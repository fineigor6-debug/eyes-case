<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYTHIC Case</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>

.case-screen{
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
padding:20px;
}

/* CASE */

.case-area{
position:relative;
height:120px;
display:flex;
align-items:center;
justify-content:center;
}

.case-open{
transition:0.5s;
}

.case-open.active{
transform:scale(1.4);
opacity:0;
}

/* ROULETTE */

.roulette-container{
position:absolute;
width:100%;
max-width:350px;
overflow:hidden;
border:2px solid #333;
border-radius:10px;
background:#111;
height:90px;
display:none;
}

.pointer{
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
font-size:20px;
color:red;
z-index:5;
}

.roulette{
display:flex;
gap:10px;
padding:10px;
transition:4s cubic-bezier(.1,.7,.1,1);
}

.item{
min-width:70px;
height:70px;
background:#1a1a1a;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid #333;
}

.item img{
width:55px;
}

/* DROP ITEMS GRID */

.case-items{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-top:10px;
width:100%;
max-width:350px;
}

.case-item{
background:#121212;
border-radius:14px;
border:1px solid #2a2a2a;
overflow:hidden;
display:flex;
flex-direction:column;
align-items:center;
transition:0.2s;
box-shadow:0 0 0 rgba(0,0,0,0);
}

/* IMAGE AREA */

.case-item-img{
padding:14px;
display:flex;
justify-content:center;
align-items:center;
height:90px;
width:100%;
background:#161616;
}

.case-item-img img{
width:65px;
height:auto;
}

/* NAME AREA */

.case-item-name{
width:100%;
background:#1e1e1e;
font-size:11px;
padding:6px 4px;
text-align:center;
border-top:1px solid #2a2a2a;
color:#dcdcdc;
}

.case-item:hover{
transform:scale(1.05);
border-color:#444;
}

/* WIN POPUP */

.win-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:0.3s;
}

.win-popup.active{
opacity:1;
pointer-events:auto;
}

.win-box{
background:#111;
border-radius:14px;
padding:30px;
text-align:center;
border:1px solid #333;
}

.win-item img{
width:90px;
margin:10px 0;
}

/* BUTTON DISABLED */

.open-btn:disabled{
opacity:0.5;
cursor:not-allowed;
}

</style>

</head>

<body>

<script>

const tg = window.Telegram.WebApp
tg.expand()

function goBack(){

if(spinning){
showNotice("Кейс уже открывается")
return
}

window.location.href="../index.html"

}

const items=[

{name:"Big Year",img:"../nft/eyes-mythic-drop/Big-Year.png"},
{name:"Clover Pin",img:"../nft/eyes-mythic-drop/Clover-Pin.png"},
{name:"Diamond Ring",img:"../nft/eyes-mythic-drop/Diamond-Ring.png"},
{name:"Evil Eye",img:"../nft/eyes-mythic-drop/Evil-Eye.png"},
{name:"Ice Cream",img:"../nft/eyes-mythic-drop/Ice-Cream.png"},
{name:"Input Key",img:"../nft/eyes-mythic-drop/Input-Key.png"},
{name:"Love Potion",img:"../nft/eyes-mythic-drop/Love-Potion.png"},
{name:"Mad Pumpkin",img:"../nft/eyes-mythic-drop/Mad-Pumpkin.png"},
{name:"Money Pot",img:"../nft/eyes-mythic-drop/Money-Pot.png"},
{name:"Mousse Cake",img:"../nft/eyes-mythic-drop/Mousse-Cake.png"},
{name:"Sharp Tongue",img:"../nft/eyes-mythic-drop/Sharp-Tongue.png"},
{name:"Sleigh Bell",img:"../nft/eyes-mythic-drop/Sleigh-Bell.png"},
{name:"Snoop Dogg",img:"../nft/eyes-mythic-drop/Snoop-Dogg.png"}

]

const casePrice=25
let spinning=false

function openCase(){

if(spinning) return

if(!payForCase(casePrice)) return

let opened=localStorage.getItem("openedCases")||0
opened++
localStorage.setItem("openedCases",opened)

spinning=true

const caseImg=document.getElementById("caseImg")
const roulette=document.getElementById("roulette")
const container=document.getElementById("rouletteContainer")
const btn=document.getElementById("openBtn")

btn.disabled=true

caseImg.classList.add("active")

setTimeout(()=>{

container.style.display="block"
roulette.innerHTML=""
roulette.style.transform="translateX(0px)"

for(let i=0;i<50;i++){

const rand=items[Math.floor(Math.random()*items.length)]

const item=document.createElement("div")
item.className="item"

item.innerHTML=`<img src="${rand.img}">`
item.dataset.name=rand.name
item.dataset.img=rand.img

roulette.appendChild(item)

}

const winIndex=35+Math.floor(Math.random()*5)
const offset=winIndex*80

setTimeout(()=>{
roulette.style.transform="translateX(-"+offset+"px)"
},100)

setTimeout(()=>{

const winItem=roulette.children[winIndex].dataset.name
const winImg=roulette.children[winIndex].dataset.img

document.getElementById("winItem").innerHTML=
`<img src="${winImg}"><br>${winItem}`

document.getElementById("winPopup").classList.add("active")

},4200)

},500)

}

function closeWin(){

document.getElementById("winPopup").classList.remove("active")

const caseImg=document.getElementById("caseImg")
const roulette=document.getElementById("roulette")
const container=document.getElementById("rouletteContainer")
const btn=document.getElementById("openBtn")

caseImg.classList.remove("active")
container.style.display="none"
roulette.innerHTML=""

btn.disabled=false
spinning=false

}

</script>
