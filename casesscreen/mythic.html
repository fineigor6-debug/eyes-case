<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYTHIC Case</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
.case-screen{
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
padding:20px;
}
</style>

</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<button class="back-btn" onclick="goBack()">←</button>

<div class="username">
MYTHIC CASE
</div>

</div>

<!-- CASE SCREEN -->

<div class="case-screen">

<div class="case-area">

<div class="pointer">▼</div>

<img id="caseImg" src="../CasesPhoto/image.png" class="case-img case-open">

<div class="roulette-container" id="rouletteContainer">

<div class="roulette" id="roulette"></div>

</div>

</div>

<div class="case-title">
MYTHIC
</div>

<button class="open-btn" onclick="openCase()">
Открыть кейс
</button>

<!-- содержимое кейса -->

<div class="case-items">

<div class="case-item">NFT DEVIL</div>
<div class="case-item">NFT DEMON</div>
<div class="case-item">NFT DRAGON</div>
<div class="case-item">NFT EYES</div>
<div class="case-item">NFT SHADOW</div>
<div class="case-item">NFT DARK</div>
<div class="case-item">NFT BLOOD</div>
<div class="case-item">NFT KING</div>

</div>

</div>

</div>

<!-- POPUP ВЫИГРЫША -->

<div class="win-popup" id="winPopup">

<div class="win-card">

<div>🎉 Вам выпало</div>

<div class="win-item" id="winItem">
NFT
</div>

<button class="claim-btn" onclick="closeWin()">
Забрать
</button>

</div>

</div>

<script>

const tg = window.Telegram.WebApp
tg.expand()

function goBack(){
window.location.href="../index.html"
}

const items = [
"DEVIL",
"DEMON",
"DRAGON",
"EYES",
"SHADOW",
"DARK",
"BLOOD",
"KING"
]

function openCase(){

const caseImg = document.getElementById("caseImg")
const roulette = document.getElementById("roulette")
const container = document.getElementById("rouletteContainer")

caseImg.classList.add("active")

setTimeout(()=>{

caseImg.style.visibility="hidden"

container.style.display="block"

roulette.innerHTML=""

/* создаём рулетку */

for(let i=0;i<50;i++){

const item = document.createElement("div")
item.className="item"

const rand = items[Math.floor(Math.random()*items.length)]

item.innerText = rand

roulette.appendChild(item)

}

/* индекс выигрыша */

const winIndex = 35 + Math.floor(Math.random()*5)

const offset = winIndex * 80

setTimeout(()=>{
roulette.style.transform="translateX(-"+offset+"px)"
},100)

/* popup выигрыша */

setTimeout(()=>{

const winItem = roulette.children[winIndex].innerText

document.getElementById("winItem").innerText = winItem

document.getElementById("winPopup").classList.add("active")

},3400)

},700)

}

function closeWin(){
document.getElementById("winPopup").classList.remove("active")
}

</script>

</body>
</html>
