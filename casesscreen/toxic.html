<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOXIC Case</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>

body{
background:#0b0b0b;
font-family:'Orbitron',sans-serif;
}

.case-screen{
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
padding:20px;
}

.case-area{
position:relative;
height:120px;
display:flex;
align-items:center;
justify-content:center;
}

.case-open{
transition:0.5s;
}

.case-open.active{
transform:scale(1.4);
opacity:0;
}

.roulette-container{
position:absolute;
width:100%;
max-width:350px;
overflow:hidden;
border:2px solid #2a0000;
border-radius:10px;
background:#111;
height:90px;
display:none;
box-shadow:0 0 15px rgba(255,0,0,0.25);
}

.pointer{
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
font-size:20px;
color:#ff2b2b;
z-index:5;
}

.roulette{
display:flex;
gap:10px;
padding:10px;
transition:4s cubic-bezier(.1,.7,.1,1);
}

.item{
min-width:70px;
max-width:70px;
height:70px;
background:#1a0000;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,0,0,0.25);
box-shadow:0 0 6px rgba(255,0,0,0.2);
}

.item img{
width:55px;
filter:drop-shadow(0 0 5px rgba(255,0,0,0.6));
}

.win-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:0.3s;
}

.win-popup.active{
opacity:1;
pointer-events:auto;
}

.win-box{
background:#111;
border-radius:14px;
padding:30px;
text-align:center;
border:1px solid rgba(255,0,0,0.4);
box-shadow:0 0 20px rgba(255,0,0,0.4);
}

.win-item img{
width:90px;
margin:10px 0;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

<button class="back-btn" onclick="goBack()">←</button>

<div class="username">
TOXIC CASE
</div>

</div>

<div class="case-screen">

<div class="case-area">

<img id="caseImg" src="../CasesPhoto/IMG_0833.png" class="case-img case-open">

<div class="roulette-container" id="rouletteContainer">

<div class="pointer">▼</div>

<div class="roulette" id="roulette"></div>

</div>

</div>

<div class="case-title">
TOXIC
</div>

<button class="open-btn" id="openBtn" onclick="openCase()">
Открыть кейс • 9 TON
</button>

</div>

</div>

<div class="win-popup" id="winPopup">

<div class="win-box">

<div>🎉 Вам выпало</div>

<div class="win-item" id="winItem"></div>

<button class="open-btn" onclick="closeWin()">Забрать</button>

</div>

</div>

<script>

const tg = window.Telegram.WebApp
tg.expand()

function goBack(){

if(spinning){
return
}

window.location.href="../index.html"

}

/* ШАНСЫ */

const items=[

{name:"Cupid Charm",img:"../nft/toxic-nft/Cupid-Charm.png",weight:0.5},
{name:"Money Pot",img:"../nft/toxic-nft/Money-Pot.png",weight:0.7},
{name:"Santa Hat",img:"../nft/toxic-nft/Santa-Hat.png",weight:1},

{name:"Magic Potion",img:"../nft/toxic-nft/Magic-Potion.png",weight:3},
{name:"Sharp Tongue",img:"../nft/toxic-nft/Sharp-Tongue.png",weight:4},
{name:"Hex Pot",img:"../nft/toxic-nft/Hex-Pot.png",weight:5},

{name:"Berry Box",img:"../nft/toxic-nft/Berry-Box.png",weight:7},
{name:"Love Potion",img:"../nft/toxic-nft/Love-Potion.png",weight:9},
{name:"Snow Globe",img:"../nft/toxic-nft/Snow-Globe.png",weight:11},

{name:"Instant Ramen",img:"../nft/toxic-nft/Instant-Ramen.png",weight:13},
{name:"Restless Jar",img:"../nft/toxic-nft/Restless-Jar.png",weight:15},
{name:"Swag Bag",img:"../nft/toxic-nft/Swag-Bag.png",weight:17},

{name:"4 TON",img:"../nft/eyes-mythic-drop/AA91F33F-9FED-4F7E-B660-578A4AB4F015.png",weight:25},
{name:"1.5 TON",img:"../nft/eyes-mythic-drop/AA91F33F-9FED-4F7E-B660-578A4AB4F015.png",weight:30},
{name:"0.85 TON",img:"../nft/eyes-mythic-drop/AA91F33F-9FED-4F7E-B660-578A4AB4F015.png",weight:35}

]

const casePrice=9
let spinning=false

function getRandomItem(){

let total=0
items.forEach(i=> total+=i.weight)

let rand=Math.random()*total

for(let item of items){

if(rand<item.weight){
return item
}

rand-=item.weight

}

}

function openCase(){

if(spinning) return
if(!payForCase(casePrice)) return

spinning=true

const caseImg=document.getElementById("caseImg")
const roulette=document.getElementById("roulette")
const container=document.getElementById("rouletteContainer")
const btn=document.getElementById("openBtn")

btn.disabled=true
caseImg.classList.add("active")

setTimeout(()=>{

container.style.display="block"
roulette.innerHTML=""
roulette.style.transform="translateX(0px)"

for(let i=0;i<50;i++){

const rand=getRandomItem()

const item=document.createElement("div")
item.className="item"

item.innerHTML=`<img src="${rand.img}">`
item.dataset.name=rand.name
item.dataset.img=rand.img

roulette.appendChild(item)

}

/* ПОЧТИ ВЫПАЛ ДОРОГОЙ NFT */

if(Math.random()<0.4){

const rare=items.slice(0,3)
const near=rare[Math.floor(Math.random()*rare.length)]

const fake=document.createElement("div")
fake.className="item"
fake.innerHTML=`<img src="${near.img}">`

roulette.insertBefore(fake,roulette.children[34])

}

const winIndex=35+Math.floor(Math.random()*5)
const offset=winIndex*80

setTimeout(()=>{
roulette.style.transform="translateX(-"+offset+"px)"
},100)

setTimeout(()=>{

const winItem=roulette.children[winIndex].dataset.name
const winImg=roulette.children[winIndex].dataset.img

document.getElementById("winItem").innerHTML=
`<img src="${winImg}"><br>${winItem}`

document.getElementById("winPopup").classList.add("active")

},4200)

},500)

}

function closeWin(){

document.getElementById("winPopup").classList.remove("active")

const caseImg=document.getElementById("caseImg")
const roulette=document.getElementById("roulette")
const container=document.getElementById("rouletteContainer")
const btn=document.getElementById("openBtn")

caseImg.classList.remove("active")
container.style.display="none"
roulette.innerHTML=""

btn.disabled=false
spinning=false

}

</script>

</body>
</html>
