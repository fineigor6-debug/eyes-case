<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOLD Case</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>

body{
background:#0b0b0b;
font-family:'Orbitron',sans-serif;
}

.case-screen{
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
padding:20px;
}

.case-area{
position:relative;
height:120px;
display:flex;
align-items:center;
justify-content:center;
}

.case-open{
transition:0.5s;
}

.case-open.active{
transform:scale(1.4);
opacity:0;
}

.roulette-container{
position:absolute;
width:100%;
max-width:350px;
overflow:hidden;
border:2px solid #332200;
border-radius:10px;
background:#111;
height:90px;
display:none;
box-shadow:0 0 15px rgba(255,180,0,0.25);
}

.pointer{
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
font-size:20px;
color:#ffcc00;
z-index:5;
}

.roulette{
display:flex;
gap:10px;
padding:10px;
transition:4s cubic-bezier(.1,.7,.1,1);
}

.item{
min-width:70px;
max-width:70px;
height:70px;
background:#1a1400;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,200,0,0.3);
}

.item img{
width:55px;
filter:drop-shadow(0 0 6px rgba(255,200,0,0.7));
}

.case-items{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
margin-top:10px;
width:100%;
max-width:350px;
}

.case-item{
background:linear-gradient(180deg,#1c1600,#0f0f0f);
border-radius:14px;
border:1px solid rgba(255,200,0,0.3);
overflow:hidden;
display:flex;
flex-direction:column;
align-items:center;
}

.case-item-img{
padding:14px;
display:flex;
justify-content:center;
align-items:center;
height:95px;
width:100%;
}

.case-item-img img{
width:70px;
filter:drop-shadow(0 0 10px rgba(255,200,0,0.7));
}

.case-item-name{
width:100%;
background:#141414;
font-size:11px;
padding:6px 4px;
text-align:center;
border-top:1px solid rgba(255,200,0,0.25);
}

.win-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:0.3s;
}

.win-popup.active{
opacity:1;
pointer-events:auto;
}

.win-box{
background:#111;
border-radius:14px;
padding:30px;
text-align:center;
border:1px solid rgba(255,200,0,0.5);
box-shadow:0 0 25px rgba(255,200,0,0.4);
}

.win-item img{
width:100px;
margin:10px 0;
filter:drop-shadow(0 0 12px gold);
}

</style>

</head>

<body>

<div class="app">

<div class="header">

<button class="back-btn" onclick="goBack()">←</button>

<div class="username">
GOLD CASE
</div>

</div>

<div class="case-screen">

<div class="case-area">

<img id="caseImg" src="../CasesPhoto/IMG_0802.png" class="case-img case-open">

<div class="roulette-container" id="rouletteContainer">

<div class="pointer">▼</div>

<div class="roulette" id="roulette"></div>

</div>

</div>

<div class="case-title">
GOLD
</div>

<button class="open-btn" id="openBtn" onclick="openCase()">
Открыть кейс • 25
</button>

</div>

</div>

<div class="win-popup" id="winPopup">

<div class="win-box">

<div>🎉 Вам выпало</div>

<div class="win-item" id="winItem"></div>

<button class="open-btn" onclick="closeWin()">Забрать</button>

</div>

</div>

<script>

const tg = window.Telegram.WebApp
tg.expand()

function goBack(){

if(spinning){
showNotice("Кейс уже открывается")
return
}

window.location.href="../index.html"

}

/* NFT С РЕАЛЬНЫМИ ШАНСАМИ */

const items=[

{name:"Pet Snake • +4.61 TON",img:"../nft/gold-nft/Pet-Snake.png",weight:7.5},

{name:"Ice Cream • +4.67 TON",img:"../nft/gold-nft/Ice-Cream.png",weight:7.2},

{name:"Swag Bag • +5.27 TON",img:"../nft/gold-nft/Swag-Bag.png",weight:6.5},

{name:"Moon Pendant • +5.34 TON",img:"../nft/gold-nft/Moon-Pendant.png",weight:6.3},

{name:"Snoop Dogg • +5.26 TON",img:"../nft/gold-nft/Snoop-Dogg.png",weight:6.4},

{name:"Easter Egg • +5.62 TON",img:"../nft/gold-nft/Easter-Egg.png",weight:5.8},

{name:"Spring Basket • +5.81 TON",img:"../nft/gold-nft/Spring-Basket.png",weight:5.4},

{name:"Desk Calendar • +6.56 TON",img:"../nft/gold-nft/Desk-Calendar.png",weight:4.6},

{name:"Jingle Bells • +9.29 TON",img:"../nft/gold-nft/Jingle-Bells.png",weight:3.2},

{name:"Top Hat • +11.11 TON",img:"../nft/gold-nft/Top-Hat.png",weight:2.2},

{name:"Rare Bird • +28.14 TON",img:"../nft/gold-nft/Rare-Bird.png",weight:0.8}

]

function getRandomItem(){

let totalWeight=0

items.forEach(i=> totalWeight+=i.weight)

let random=Math.random()*totalWeight

for(let item of items){

if(random<item.weight){
return item
}

random-=item.weight

}

}

const casePrice=25
let spinning=false

function openCase(){

if(spinning) return
if(!payForCase(casePrice)) return

spinning=true

const caseImg=document.getElementById("caseImg")
const roulette=document.getElementById("roulette")
const container=document.getElementById("rouletteContainer")
const btn=document.getElementById("openBtn")

btn.disabled=true
caseImg.classList.add("active")

setTimeout(()=>{

container.style.display="block"
roulette.innerHTML=""
roulette.style.transform="translateX(0px)"

/* создаем рулетку */

for(let i=0;i<50;i++){

let rand=getRandomItem()

/* эффект почти Rare Bird */

if(Math.random()<0.08){
rand=items[10]
}

const item=document.createElement("div")
item.className="item"

item.innerHTML=`<img src="${rand.img}">`
item.dataset.name=rand.name
item.dataset.img=rand.img

roulette.appendChild(item)

}

/* победный слот */

const winIndex=35+Math.floor(Math.random()*5)
const winItem=getRandomItem()

roulette.children[winIndex].dataset.name=winItem.name
roulette.children[winIndex].dataset.img=winItem.img
roulette.children[winIndex].innerHTML=`<img src="${winItem.img}">`

const offset=winIndex*80

setTimeout(()=>{
roulette.style.transform="translateX(-"+offset+"px)"
},100)

setTimeout(()=>{

document.getElementById("winItem").innerHTML=
`<img src="${winItem.img}"><br>${winItem.name}`

document.getElementById("winPopup").classList.add("active")

},4200)

},500)

}

function closeWin(){

document.getElementById("winPopup").classList.remove("active")

const caseImg=document.getElementById("caseImg")
const roulette=document.getElementById("roulette")
const container=document.getElementById("rouletteContainer")
const btn=document.getElementById("openBtn")

caseImg.classList.remove("active")
container.style.display="none"
roulette.innerHTML=""

btn.disabled=false
spinning=false

}

</script>

</body>
</html>
