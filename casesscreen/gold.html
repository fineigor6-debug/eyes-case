<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOLD Case</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>

body{
background:#0b0b0b;
font-family:'Orbitron',sans-serif;
}

/* SCREEN */

.case-screen{
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
padding:20px;
}

/* CASE */

.case-area{
position:relative;
height:120px;
display:flex;
align-items:center;
justify-content:center;
}

.case-open{
transition:0.5s;
}

.case-open.active{
transform:scale(1.4);
opacity:0;
}

/* ROULETTE */

.roulette-container{
position:absolute;
width:100%;
max-width:350px;
overflow:hidden;
border:2px solid #2a0000;
border-radius:10px;
background:#111;
height:90px;
display:none;
box-shadow:0 0 15px rgba(255,0,0,0.25);
}

.pointer{
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
font-size:20px;
color:#ff2b2b;
z-index:5;
}

.roulette{
display:flex;
gap:10px;
padding:10px;
transition:4s cubic-bezier(.1,.7,.1,1);
}

.item{
min-width:70px;
max-width:70px;
height:70px;
background:#1a0000;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,0,0,0.25);
box-shadow:0 0 6px rgba(255,0,0,0.2);
}

.item img{
width:55px;
filter:drop-shadow(0 0 5px rgba(255,0,0,0.6));
}

/* NFT GRID */

.case-items{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
margin-top:10px;
width:100%;
max-width:350px;
}

/* CARD */

.case-item{
background:linear-gradient(180deg,#1a0000,#0f0f0f);
border-radius:14px;
border:1px solid rgba(255,0,0,0.25);
overflow:hidden;
display:flex;
flex-direction:column;
align-items:center;
position:relative;

box-shadow:
0 0 12px rgba(255,0,0,0.15),
inset 0 0 8px rgba(255,0,0,0.1);
}

/* AUTO MIRROR SHINE */

.case-item::after{
content:"";
position:absolute;
top:0;
left:-120%;
width:60%;
height:100%;
background:linear-gradient(
120deg,
transparent,
rgba(255,255,255,0.18),
transparent
);
transform:skewX(-20deg);
animation:shine 4s linear infinite;
}

@keyframes shine{

0%{ left:-120%; }
60%{ left:120%; }
100%{ left:120%; }

}

/* IMAGE */

.case-item-img{
padding:14px;
display:flex;
justify-content:center;
align-items:center;
height:95px;
width:100%;
background:linear-gradient(180deg,#1b0000,#141414);
}

.case-item-img img{
width:70px;
height:auto;
filter:drop-shadow(0 0 8px rgba(255,0,0,0.6));
}

/* NAME */

.case-item-name{
width:100%;
background:linear-gradient(180deg,#1c0000,#1a1a1a);
font-size:11px;
padding:6px 4px;
text-align:center;
border-top:1px solid rgba(255,0,0,0.25);
color:#f2f2f2;
}

/* WIN POPUP */

.win-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:0.3s;
}

.win-popup.active{
opacity:1;
pointer-events:auto;
}

.win-box{
background:#111;
border-radius:14px;
padding:30px;
text-align:center;
border:1px solid rgba(255,0,0,0.4);
box-shadow:0 0 20px rgba(255,0,0,0.4);
}

.win-item img{
width:90px;
margin:10px 0;
filter:drop-shadow(0 0 10px rgba(255,0,0,0.8));
}

.open-btn:disabled{
opacity:0.5;
cursor:not-allowed;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

<button class="back-btn" onclick="goBack()">←</button>

<div class="username">
GOLD CASE
</div>

</div>

<div class="case-screen">

<div class="case-area">

<img id="caseImg" src="../CasesPhoto/image.png" class="case-img case-open">

<div class="roulette-container" id="rouletteContainer">

<div class="pointer">▼</div>

<div class="roulette" id="roulette"></div>

</div>

</div>

<div class="case-title">
GOLD
</div>

<button class="open-btn" id="openBtn" onclick="openCase()">
Открыть кейс • 25
</button>

<div class="case-items">

<div class="case-item"><div class="case-item-img"><img src="../nft/gold-nft/Desk-Calendar.png"></div><div class="case-item-name">Desk Calendar</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/gold-nft/Easter-Egg.png"></div><div class="case-item-name">Easter Egg</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/gold-nft/Ice-Cream.png"></div><div class="case-item-name">Ice Cream</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/gold-nft/Jingle-Bells.png"></div><div class="case-item-name">Jingle Bells</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/gold-nft/Moon-Pendant.png"></div><div class="case-item-name">Moon Pendant</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/gold-nft/Pet-Snake.png"></div><div class="case-item-name">Pet Snake</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/gold-nft/Rare-Bird.png"></div><div class="case-item-name">Rare Bird</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/gold-nft/Snoop-Dogg.png"></div><div class="case-item-name">Snoop Dogg</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/gold-nft/Spring-Basket.png"></div><div class="case-item-name">Spring Basket</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/gold-nft/Swag-Bag.png"></div><div class="case-item-name">Swag Bag</div></div>
<div class="case-item"><div class="case-item-img"><img src="../nft/gold-nft/Top-Hat.png"></div><div class="case-item-name">Top Hat</div></div>

</div>

</div>

</div>

<div class="win-popup" id="winPopup">

<div class="win-box">

<div>🎉 Вам выпало</div>

<div class="win-item" id="winItem"></div>

<button class="open-btn" onclick="closeWin()">Забрать</button>

</div>

</div>

<script src="../app/app.js"></script>

<script>

const tg = window.Telegram.WebApp
tg.expand()

function goBack(){

if(spinning){
showNotice("Кейс уже открывается")
return
}

window.location.href="../index.html"

}

const items=[

{name:"Desk Calendar",img:"../nft/gold-nft/Desk-Calendar.png"},
{name:"Easter Egg",img:"../nft/gold-nft/Easter-Egg.png"},
{name:"Ice Cream",img:"../nft/gold-nft/Ice-Cream.png"},
{name:"Jingle Bells",img:"../nft/gold-nft/Jingle-Bells.png"},
{name:"Moon Pendant",img:"../nft/gold-nft/Moon-Pendant.png"},
{name:"Pet Snake",img:"../nft/gold-nft/Pet-Snake.png"},
{name:"Rare Bird",img:"../nft/gold-nft/Rare-Bird.png"},
{name:"Snoop Dogg",img:"../nft/gold-nft/Snoop-Dogg.png"},
{name:"Spring Basket",img:"../nft/gold-nft/Spring-Basket.png"},
{name:"Swag Bag",img:"../nft/gold-nft/Swag-Bag.png"},
{name:"Top Hat",img:"../nft/gold-nft/Top-Hat.png"}

]

const casePrice=25
let spinning=false

function openCase(){

if(spinning) return
if(!payForCase(casePrice)) return

spinning=true

const caseImg=document.getElementById("caseImg")
const roulette=document.getElementById("roulette")
const container=document.getElementById("rouletteContainer")
const btn=document.getElementById("openBtn")

btn.disabled=true
caseImg.classList.add("active")

setTimeout(()=>{

container.style.display="block"
roulette.innerHTML=""
roulette.style.transform="translateX(0px)"

for(let i=0;i<50;i++){

const rand=items[Math.floor(Math.random()*items.length)]

const item=document.createElement("div")
item.className="item"

item.innerHTML=`<img src="${rand.img}">`
item.dataset.name=rand.name
item.dataset.img=rand.img

roulette.appendChild(item)

}

const winIndex=35+Math.floor(Math.random()*5)
const offset=winIndex*80

setTimeout(()=>{
roulette.style.transform="translateX(-"+offset+"px)"
},100)

setTimeout(()=>{

const winItem=roulette.children[winIndex].dataset.name
const winImg=roulette.children[winIndex].dataset.img

document.getElementById("winItem").innerHTML=
`<img src="${winImg}"><br>${winItem}`

document.getElementById("winPopup").classList.add("active")

},4200)

},500)

}

function closeWin(){

document.getElementById("winPopup").classList.remove("active")

const caseImg=document.getElementById("caseImg")
const roulette=document.getElementById("roulette")
const container=document.getElementById("rouletteContainer")
const btn=document.getElementById("openBtn")

caseImg.classList.remove("active")
container.style.display="none"
roulette.innerHTML=""

btn.disabled=false
spinning=false

}

</script>

</body>
</html>
