<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOLD Case</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="../style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>

body{
background:#0b0b0b;
font-family:'Orbitron',sans-serif;
}

.case-screen{
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
padding:20px;
}

.case-area{
position:relative;
height:120px;
display:flex;
align-items:center;
justify-content:center;
}

.case-open{
transition:0.5s;
}

.case-open.active{
transform:scale(1.4);
opacity:0;
}

.roulette-container{
position:absolute;
width:100%;
max-width:350px;
overflow:hidden;
border:2px solid #2a0000;
border-radius:10px;
background:#111;
height:90px;
display:none;
box-shadow:0 0 15px rgba(255,0,0,0.25);
}

.pointer{
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
font-size:20px;
color:#ff2b2b;
z-index:5;
}

.roulette{
display:flex;
gap:10px;
padding:10px;
transition:4s cubic-bezier(.1,.7,.1,1);
}

.item{
min-width:70px;
max-width:70px;
height:70px;
background:#1a0000;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,0,0,0.25);
box-shadow:0 0 6px rgba(255,0,0,0.2);
}

.item img{
width:55px;
filter:drop-shadow(0 0 5px rgba(255,0,0,0.6));
}

.case-items{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
margin-top:10px;
width:100%;
max-width:350px;
}

.case-item{
background:linear-gradient(180deg,#1a0000,#0f0f0f);
border-radius:14px;
border:1px solid rgba(255,0,0,0.25);
overflow:hidden;
display:flex;
flex-direction:column;
align-items:center;
position:relative;
box-shadow:0 0 12px rgba(255,0,0,0.15), inset 0 0 8px rgba(255,0,0,0.1);
}

.case-item::after{
content:"";
position:absolute;
top:0;
left:-120%;
width:60%;
height:100%;
background:linear-gradient(
120deg,
transparent,
rgba(255,255,255,0.18),
transparent
);
transform:skewX(-20deg);
animation:shine 4s linear infinite;
}

@keyframes shine{
0%{ left:-120%; }
60%{ left:120%; }
100%{ left:120%; }
}

.case-item-img{
padding:14px;
display:flex;
justify-content:center;
align-items:center;
height:95px;
width:100%;
background:linear-gradient(180deg,#1b0000,#141414);
}

.case-item-img img{
width:70px;
height:auto;
filter:drop-shadow(0 0 8px rgba(255,0,0,0.6));
}

.case-item-name{
width:100%;
background:linear-gradient(180deg,#1c0000,#1a1a1a);
font-size:11px;
padding:6px 4px;
text-align:center;
border-top:1px solid rgba(255,0,0,0.25);
color:#f2f2f2;
}

.price{
font-size:10px;
color:#00d4ff;
margin-top:2px;
}

.win-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:0.3s;
}

.win-popup.active{
opacity:1;
pointer-events:auto;
}

.win-box{
background:#111;
border-radius:14px;
padding:30px;
text-align:center;
border:1px solid rgba(255,0,0,0.4);
box-shadow:0 0 20px rgba(255,0,0,0.4);
}

.win-item img{
width:90px;
margin:10px 0;
filter:drop-shadow(0 0 10px rgba(255,0,0,0.8));
}

.open-btn:disabled{
opacity:0.5;
cursor:not-allowed;
}

</style>

</head>
