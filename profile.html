<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Profile</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<button class="back-btn" onclick="goHome()">←</button>

<div class="username">
PROFILE
</div>

</div>

<div class="profile">

<img id="avatar" class="profile-avatar" src="https://placehold.co/100">

<div id="name" class="profile-name">
Player
</div>

<!-- STATS -->

<div class="stats">

<div class="stat">
<div class="stat-title">Баланс</div>

<div class="stat-value balance-box" onclick="openBalanceTester()">

<svg class="ton-icon" viewBox="0 0 56 56">
<path fill="currentColor" d="M28 0C12.5 0 0 12.5 0 28s12.5 28 28 28 28-12.5 28-28S43.5 0 28 0zm13.4 17.5L29.9 41.2c-.6 1.2-2.3 1.2-2.9 0L14.6 17.5c-.5-1 .2-2.2 1.3-2.2h24.2c1.1 0 1.8 1.2 1.3 2.2z"/>
</svg>

<span id="balance">0</span>

</div>
  
</div>
<div class="stat">
<div class="stat-title">Открыто кейсов</div>
<div class="stat-value" id="opened">0</div>
</div>

</div>

<!-- INVENTORY -->

<div class="inventory">

<div class="inventory-title">
ИНВЕНТАРЬ
</div>

<div class="inventory-grid">

<div class="inventory-item">

<img
src="nft/IMG_0767.png"
class="inventory-img"
loading="lazy"
>

<div class="inventory-name">
Plush Pepes
</div>

</div>

</div>

</div>

</div>

<!-- TESTER POPUP -->

<div class="tester-popup" id="testerPopup">

<div class="tester-box">

<div class="tester-title">
Выдать валюту
</div>

<input
type="number"
id="testerAmount"
placeholder="1 - 100"
min="1"
max="100"
>

<button class="open-btn" onclick="giveTestBalance()">
Выдать
</button>

<button class="tester-close" onclick="closeTester()">
Отмена
</button>

</div>

</div>

</div>

<!-- NAVIGATION -->

<div class="nav">

<button class="nav-btn" onclick="goHome()">

<svg class="nav-icon" viewBox="0 0 24 24">
<path d="M12 3L2 12h3v8h6v-5h2v5h6v-8h3z"/>
</svg>

<span>Главная</span>

</button>

<button class="nav-btn disabled">

<svg class="nav-icon" viewBox="0 0 24 24">
<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
</svg>

<span>Лидерборд</span>

</button>

<button class="nav-btn">

<svg class="nav-icon" viewBox="0 0 24 24">
<path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
</svg>

<span>Профиль</span>

</button>

</div>

</div>

<script src="app/app.js"></script>
<script src="app/profile.js"></script>

</body>
</html>
