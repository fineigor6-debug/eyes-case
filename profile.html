<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Profile</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>

.profile{
display:flex;
flex-direction:column;
align-items:center;
padding:30px 20px;
gap:20px;
}

.profile-avatar{
width:90px;
height:90px;
border-radius:50%;
border:3px solid #ff2b2b;
box-shadow:0 0 15px rgba(255,0,0,0.6);
}

.profile-name{
font-size:18px;
font-weight:bold;
}

.stats{
width:100%;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:10px;
}

.stat{
background:#141414;
border:1px solid #333;
border-radius:12px;
padding:15px;
text-align:center;
}

.stat-title{
font-size:12px;
color:#aaa;
}

.stat-value{
font-size:18px;
margin-top:5px;
font-family:'Orbitron';
color:#ff2b2b;
}

.inventory{
margin-top:25px;
width:100%;
}

.inventory-title{
font-family:'Orbitron';
margin-bottom:10px;
}

.inventory-box{
background:#111;
border:1px solid #333;
border-radius:12px;
padding:20px;
text-align:center;
color:#777;
}

</style>

</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<button class="back-btn" onclick="goBack()">←</button>

<div class="username">
PROFILE
</div>

</div>

<div class="profile">

<img id="avatar" class="profile-avatar" src="https://placehold.co/100">

<div id="name" class="profile-name">
Player
</div>

<div class="stats">

<div class="stat">
<div class="stat-title">Баланс</div>
<div class="stat-value" id="balance">0</div>
</div>

<div class="stat">
<div class="stat-title">Открыто кейсов</div>
<div class="stat-value" id="opened">0</div>
</div>

</div>

<div class="inventory">

<div class="inventory-title">
ИНВЕНТАРЬ
</div>

<div class="inventory-box">
Пока пусто
</div>

</div>

</div>

</div>

<script>

const tg = window.Telegram.WebApp
tg.expand()

function goBack(){
window.location.href = "index.html"
}

const user = tg.initDataUnsafe?.user

if(user){

document.getElementById("name").innerText =
user.first_name + " @" + user.username

if(user.photo_url){
document.getElementById("avatar").src = user.photo_url
}

}

/* тестовые данные */

document.getElementById("balance").innerText = "100"
document.getElementById("opened").innerText = "3"

</script>

</body>
</html>
