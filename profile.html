<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Profile</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<button class="back-btn" onclick="goHome()">←</button>

<div class="username">
PROFILE
</div>

</div>

<!-- PROFILE -->

<div class="profile">

<img id="avatar" class="profile-avatar" src="https://placehold.co/100">

<div id="name" class="profile-name">
Loading...
</div>

<!-- STATS -->

<div class="stats">

<div class="stat">
<div class="stat-title">Баланс</div>
<div class="stat-value" id="balance" onclick="openBalanceTester()">0</div>
</div>

<div class="stat">
<div class="stat-title">Открыто кейсов</div>
<div class="stat-value" id="opened">0</div>
</div>

</div>

<!-- INVENTORY -->

<div class="inventory">

<div class="inventory-title">
ИНВЕНТАРЬ
</div>

<div class="inventory-grid">

<div class="inventory-item">

<img
src="nft/IMG_0767.png"
class="inventory-img"
loading="lazy"
>

<div class="inventory-name">
Plush Pepes
</div>

</div>

</div>

</div>

</div>

<!-- TESTER POPUP -->

<div class="tester-popup" id="testerPopup">

<div class="tester-box">

<div class="tester-title">
Выдать валюту
</div>

<input 
type="number"
id="testerAmount"
placeholder="0 - 100"
min="1"
max="100"
>

<button class="open-btn" onclick="giveTestBalance()">
Выдать
</button>

<button class="tester-close" onclick="closeTester()">
Отмена
</button>

</div>

</div>

</div>

<!-- SCRIPTS -->

<script src="app/app.js"></script>
<script src="app/profile.js"></script>

</body>
</html>
