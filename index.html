<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eyes Case</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- HEADER -->

<div class="header">

<img id="avatar" class="avatar" src="https://placehold.co/100">

<div id="username" class="username">
лучшие тестеры
</div>

</div>

<!-- CASES -->

<div class="container">

<!-- MYTHIC -->

<div class="case">

<img src="CasesPhoto/image.png" class="case-img">

<div class="case-title">
MYTHIC
</div>

<button class="open-btn" onclick="openCase()">
Открыть кейс
</button>

</div>

<!-- CASE В РАЗРАБОТКЕ -->

<div class="case case-disabled">

<img src="CasesPhoto/image.png" class="case-img">

<div class="case-title">
DEMON
</div>

<div class="dev-text">
В разработке
</div>

</div>

<div class="case case-disabled">

<img src="CasesPhoto/image.png" class="case-img">

<div class="case-title">
LEGEND
</div>

<div class="dev-text">
В разработке
</div>

</div>

<div class="case case-disabled">

<img src="CasesPhoto/image.png" class="case-img">

<div class="case-title">
RARE
</div>

<div class="dev-text">
В разработке
</div>

</div>

</div>

<!-- NAV -->

<div class="nav">

<button>Главная</button>

<button class="disabled">Лидерборд</button>

<button>Профиль</button>

</div>

<script>

const tg = window.Telegram.WebApp

tg.expand()

const user = tg.initDataUnsafe?.user

if(user){

document.getElementById("username").innerText =
user.first_name + " @" + user.username

if(user.photo_url){
document.getElementById("avatar").src = user.photo_url
}

}

function openCase(){

const items = [
"NFT Cat",
"NFT Demon",
"NFT Dragon",
"NFT Devil"
]

const item = items[Math.floor(Math.random()*items.length)]

alert("🎉 Вам выпало: " + item)

}

</script>

</body>
</html>
