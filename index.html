<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Devil Case</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<img id="avatar" class="avatar" src="https://placehold.co/100">

<div id="username" class="username">
Loading...
</div>

</div>

<!-- CASES -->

<div class="container">

<!-- MYTHIC -->

<div class="case">

<img src="CasesPhoto/image.png" class="case-img">

<div class="case-title">
MYTHIC
</div>

<button class="open-btn" onclick="openMythicCase()">
Открыть кейс
</button>

</div>

<!-- EYES -->

<div class="case">

<img src="CasesPhoto/image.png" class="case-img">

<div class="case-title">
EYES
</div>

<button class="open-btn" onclick="openEyesCase()">
Открыть кейс
</button>

</div>

<!-- LEGEND -->

<div class="case case-disabled">

<img src="CasesPhoto/image.png" class="case-img">

<div class="case-title">
LEGEND
</div>

<div class="dev-text">
В разработке
</div>

</div>

<!-- RARE -->

<div class="case case-disabled">

<img src="CasesPhoto/image.png" class="case-img">

<div class="case-title">
RARE
</div>

<div class="dev-text">
В разработке
</div>

</div>

</div>

<!-- NAVIGATION -->

<div class="nav">

<button class="nav-btn">

<svg class="nav-icon" viewBox="0 0 24 24">
<path d="M12 3L2 12h3v8h6v-5h2v5h6v-8h3z"/>
</svg>

<span>Главная</span>

</button>

<button class="nav-btn disabled">

<svg class="nav-icon" viewBox="0 0 24 24">
<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
</svg>

<span>Лидерборд</span>

</button>

<button class="nav-btn" onclick="openProfile()">

<svg class="nav-icon" viewBox="0 0 24 24">
<path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
</svg>

<span>Профиль</span>

</button>

</div>

</div>

<script src="app/app.js"></script>

<script>

const tg = window.Telegram.WebApp
tg.expand()

const user = tg.initDataUnsafe?.user

if(user){

document.getElementById("username").innerText =
user.first_name + (user.username ? " @" + user.username : "")

if(user.photo_url){
document.getElementById("avatar").src = user.photo_url
}

}

function openMythicCase(){
window.location.href = "casesscreen/mythic.html"
}

function openEyesCase(){
window.location.href = "casesscreen/eyes.html"
}

function openProfile(){
window.location.href = "profile.html"
}

</script>

</body>
</html>
