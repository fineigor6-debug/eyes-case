<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyes Case</title>

<style>

body{
background:#0f0f0f;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

/* картинка кейса */

.case-img{
width:180px;

/* включаем анимацию */
animation: floatCase 3s ease-in-out infinite;
}

/* сама анимация */

@keyframes floatCase{

0%{
transform: translateY(0px);
}

50%{
transform: translateY(-20px);
}

100%{
transform: translateY(0px);
}

}

</style>

</head>

<body>

<img src="IMG_0755.png" class="case-img">

</body>
</html>
