<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crash</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>

.crash-container{
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
gap:20px;
}

.multiplier{
font-size:48px;
color:#ff2b2b;
text-shadow:0 0 15px rgba(255,0,0,0.7);
}

canvas{
background:#0f0f0f;
border-radius:12px;
border:1px solid rgba(255,0,0,0.3);
}

.bet-box{
display:flex;
gap:10px;
}

.bet-input{
width:100px;
padding:10px;
background:#111;
border:1px solid #333;
color:white;
border-radius:8px;
text-align:center;
}

.crash-btn{
padding:12px 20px;
background:#ff2b2b;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
}

</style>

</head>

<body>

<div class="app">

<div class="header">
<button class="back-btn" onclick="goHome()">←</button>
<div class="username">CRASH</div>
</div>

<div class="crash-container">

<div class="multiplier" id="multiplier">1.00x</div>

<canvas id="graph" width="320" height="200"></canvas>

<div class="bet-box">
<input class="bet-input" id="bet" value="10">
<button class="crash-btn" onclick="startGame()">СТАВКА</button>
<button class="crash-btn" onclick="cashOut()">ЗАБРАТЬ</button>
</div>

</div>

</div>

<script>

const tg = window.Telegram.WebApp
tg.expand()

let gameRunning = false
let multiplier = 1
let crashPoint = 0
let interval

const canvas = document.getElementById("graph")
const ctx = canvas.getContext("2d")

function goHome(){
window.location.href="home.html"
}

function drawGraph(x, y){
ctx.lineTo(x, canvas.height - y)
ctx.strokeStyle = "red"
ctx.stroke()
}

function startGame(){

if(gameRunning) return

multiplier = 1
crashPoint = 1 + Math.random()*5
gameRunning = true

ctx.clearRect(0,0,canvas.width,canvas.height)
ctx.beginPath()
ctx.moveTo(0, canvas.height)

let x = 0

interval = setInterval(()=>{

multiplier += 0.02

document.getElementById("multiplier").innerText =
multiplier.toFixed(2) + "x"

x += 2
drawGraph(x, multiplier*20)

if(multiplier >= crashPoint){
endGame()
}

},50)

}

function cashOut(){

if(!gameRunning) return

clearInterval(interval)
gameRunning = false

let bet = Number(document.getElementById("bet").value)
let win = bet * multiplier

alert("Вы забрали: " + win.toFixed(2))

}

function endGame(){

clearInterval(interval)
gameRunning = false

document.getElementById("multiplier").innerText = "CRASH"

}

</script>

</body>
</html>
