<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crash Game Pro X</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#0b0b0b; font-family:'Orbitron',sans-serif; color:#fff; overflow:hidden; }
.header { display:flex; align-items:center; padding:10px 20px; gap:15px; }
.back-btn { background:none; border:none; color:#ff3b3b; font-size:24px; cursor:pointer; }
.username { font-weight:bold; font-size:18px; color:#ff2b2b; }
.crash-container { display:flex; flex-direction:column; align-items:center; gap:15px; padding:20px; }
.balance-box { background:#111; padding:10px 20px; border-radius:12px; border:1px solid rgba(255,0,0,0.3); box-shadow:0 0 10px rgba(255,0,0,0.2);}
.multiplier { font-size:52px; color:#ff2b2b; text-shadow:0 0 20px rgba(255,0,0,0.8); }

.canvas-container {
  position:relative;
  width:360px;
  height:400px;
  overflow:hidden;
  border-radius:12px;
  border:1px solid rgba(255,0,0,0.3);
  box-shadow:0 0 15px rgba(255,0,0,0.2);
}

canvas { position:absolute; left:0; top:0; }

#rocket {
  position:absolute;
  width:90px;
  height:90px;
  left:50%;
  top:50%;
  z-index:10;
  transform:translate(-50%, -50%) scale(1);
  transition: transform 0.05s linear;
  pointer-events:none;
  filter: drop-shadow(0 0 20px rgba(255,50,50,0.7));
}

.bet-box { display:flex; gap:10px; margin-top:10px; }
.bet-input { width:100px; padding:10px; background:#111; border:1px solid #333; color:white; border-radius:8px; text-align:center; }
.crash-btn { padding:12px 20px; background:#ff2b2b; border:none; border-radius:10px; color:white; font-weight:bold; box-shadow:0 0 10px rgba(255,0,0,0.5); cursor:pointer; }

.history { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:360px; margin-top:10px; }
.history-item { padding:4px 8px; border-radius:6px; font-size:12px; font-weight:bold; }
.h-red{ background:#3a0000; color:#ff4d4d; }
.h-orange{ background:#3a1f00; color:#ff9a2b; }
.h-green{ background:#003a0a; color:#2bff88; }

.explosion {
  position:absolute;
  width:20px;
  height:20px;
  background:orange;
  border-radius:50%;
  pointer-events:none;
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <button class="back-btn" onclick="goBack()">←</button>
    <div class="username">CRASH X</div>
  </div>

  <div class="crash-container">
    <div class="balance-box">Баланс: <span id="balance">0</span> TON</div>
    <div class="multiplier" id="multiplier">1.00x</div>
    <div class="history" id="history"></div>

    <div class="canvas-container" id="gameArea">
      <canvas id="graph" width="360" height="400"></canvas>
      <img id="rocket" src="IMG_1059.png">
    </div>

    <div class="bet-box">
      <input class="bet-input" id="bet" value="5">
      <button class="crash-btn" onclick="startGame()">СТАВКА</button>
      <button class="crash-btn" onclick="cashOut()">ЗАБРАТЬ</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

/* BALANCE */
function getBalance(){ return Number(localStorage.getItem("balance")||100); }
function addBalance(amount){ localStorage.setItem("balance", getBalance()+amount); updateBalanceUI();}
function subtractBalance(amount){ addBalance(-amount);}
function updateBalanceUI(){ document.getElementById("balance").innerText=getBalance().toFixed(2);}
updateBalanceUI();

/* HISTORY */
let crashHistory=[];
function addCrashHistory(value){ crashHistory.push(value); if(crashHistory.length>20) crashHistory.shift(); renderCrashHistory();}
function renderCrashHistory(){
  const historyEl=document.getElementById("history"); historyEl.innerHTML="";
  crashHistory.forEach(v=>{
    const item=document.createElement("div");
    item.classList.add("history-item");
    if(v<1.5)item.classList.add("h-red");
    else if(v<3)item.classList.add("h-orange");
    else item.classList.add("h-green");
    item.innerText=v.toFixed(2)+"x";
    historyEl.appendChild(item);
  });
}

/* BACK */
function goBack(){ window.location.href="index.html"; }

/* GAME */
const canvas=document.getElementById("graph");
const ctx=canvas.getContext("2d");
const rocket=document.getElementById("rocket");
const gameArea=document.getElementById("gameArea");

let gameRunning=false;
let animMultiplier=1;
let crashPoint=0;
let betAmount=0;
let points=[];
let explosions=[];

function generateCrash(){ return Math.pow(1-Math.random(),-1.5); }

function startGame(){
  if(gameRunning) return;
  betAmount=Number(document.getElementById("bet").value);
  if(betAmount<=0 || betAmount>getBalance()){ alert("Недостаточно баланса"); return; }
  subtractBalance(betAmount);

  animMultiplier=1; crashPoint=generateCrash(); points=[]; gameRunning=true;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  rocket.style.display="block";
  requestAnimationFrame(animate);
}

function animate(){
  if(!gameRunning) return;

  animMultiplier*=1.01;
  points.push(animMultiplier);
  if(points.length>canvas.width) points.shift();

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.beginPath();
  ctx.moveTo(0, canvas.height - points[0]*30);
  for(let i=0;i<points.length;i++){
    let x=i*(canvas.width/points.length);
    let y=canvas.height - points[i]*30;
    ctx.lineTo(x,y);
  }
  ctx.strokeStyle="red";
  ctx.lineWidth=3;
  ctx.stroke();

  // ракета центр + деформация
  let stretch = 1 + Math.sin(animMultiplier*2)*0.05;
  let squash = 1 - Math.sin(animMultiplier*2)*0.05;
  let shakeX = (Math.random()-0.5)*4;
  let shakeY = (Math.random()-0.5)*4;

  rocket.style.transform =
    `translate(-50%, -50%)
     translate(${shakeX}px, ${shakeY}px)
     scale(${stretch}, ${squash})
     rotate(${Math.min(animMultiplier*4, 25)}deg)`;

  document.getElementById("multiplier").innerText = animMultiplier.toFixed(2)+"x";

  if(animMultiplier>=crashPoint){ explode(); endGame(); return; }
  requestAnimationFrame(animate);
}

/* ВЗРЫВ */
function explode(){
  rocket.style.display="none";

  for(let i=0;i<25;i++){
    let div=document.createElement("div");
    div.className="explosion";
    div.style.left="50%";
    div.style.top="50%";
    gameArea.appendChild(div);

    let angle=Math.random()*Math.PI*2;
    let speed=Math.random()*5+2;

    let x=0;
    let y=0;

    function move(){
      x+=Math.cos(angle)*speed;
      y+=Math.sin(angle)*speed;
      div.style.transform=`translate(${x}px,${y}px)`;
      div.style.opacity-=0.03;
      if(div.style.opacity<=0) div.remove();
      else requestAnimationFrame(move);
    }
    div.style.opacity=1;
    move();
  }
}

function cashOut(){
  if(!gameRunning) return;
  gameRunning=false;
  const win=betAmount*animMultiplier;
  addBalance(win);
  addCrashHistory(animMultiplier);
  alert("Вы забрали "+win.toFixed(2)+" TON");
}

function endGame(){
  gameRunning=false;
  document.getElementById("multiplier").innerText="CRASH";
  addCrashHistory(animMultiplier);
}
</script>
</body>
</html>
