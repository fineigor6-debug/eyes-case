<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crash</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>

body{
background:#0b0b0b;
font-family:'Orbitron',sans-serif;
}

.crash-container{
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
gap:20px;
}

.balance-box{
background:#111;
padding:10px 20px;
border-radius:12px;
border:1px solid rgba(255,0,0,0.3);
box-shadow:0 0 10px rgba(255,0,0,0.2);
}

.multiplier{
font-size:52px;
color:#ff2b2b;
text-shadow:0 0 20px rgba(255,0,0,0.8);
}

canvas{
background:#0f0f0f;
border-radius:12px;
border:1px solid rgba(255,0,0,0.3);
box-shadow:0 0 15px rgba(255,0,0,0.2);
}

.bet-box{
display:flex;
gap:10px;
}

.bet-input{
width:100px;
padding:10px;
background:#111;
border:1px solid #333;
color:white;
border-radius:8px;
text-align:center;
}

.crash-btn{
padding:12px 20px;
background:#ff2b2b;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
box-shadow:0 0 10px rgba(255,0,0,0.5);
}

.rocket{
position:absolute;
font-size:22px;
transform:rotate(45deg);
}

</style>

</head>

<body>

<div class="app">

<div class="header">
<button class="back-btn" onclick="goHome()">←</button>
<div class="username">CRASH</div>
</div>

<div class="crash-container">

<div class="balance-box">
Баланс: <span id="balance">0</span> TON
</div>

<div class="multiplier" id="multiplier">1.00x</div>

<div class="history" id="history"></div>
  
<div style="position:relative;">
<canvas id="graph" width="320" height="200"></canvas>
<div class="rocket" id="rocket">🚀</div>
</div>

<div class="bet-box">
<input class="bet-input" id="bet" value="5">
<button class="crash-btn" onclick="startGame()">СТАВКА</button>
<button class="crash-btn" onclick="cashOut()">ЗАБРАТЬ</button>
</div>

</div>

</div>

<script src="app/app.js"></script>

<script>

const tg = window.Telegram.WebApp
tg.expand()

let gameRunning = false
let multiplier = 1
let crashPoint = 0
let interval
let betAmount = 0

const canvas = document.getElementById("graph")
const ctx = canvas.getContext("2d")
const rocket = document.getElementById("rocket")

/* БАЛАНС */
function updateBalance(){
document.getElementById("balance").innerText = getBalance()
}
updateBalance()

function goHome(){
window.location.href="index.html"
}

/* ГРАФИК */
function drawGraph(x, y){
ctx.lineTo(x, canvas.height - y)
ctx.strokeStyle = "red"
ctx.stroke()

rocket.style.left = (x+10)+"px"
rocket.style.top = (canvas.height - y - 10)+"px"
}

/* СТАРТ ИГРЫ */
function startGame(){

if(gameRunning) return

betAmount = Number(document.getElementById("bet").value)

if(!payForCase(betAmount)) return

updateBalance()

multiplier = 1
crashPoint = generateCrash()
gameRunning = true

ctx.clearRect(0,0,canvas.width,canvas.height)
ctx.beginPath()
ctx.moveTo(0, canvas.height)

let x = 0

interval = setInterval(()=>{

multiplier += 0.02

document.getElementById("multiplier").innerText =
multiplier.toFixed(2) + "x"

x += 2
drawGraph(x, multiplier*25)

if(multiplier >= crashPoint){
endGame()
}

},50)

}

/* ЗАБРАТЬ */
function cashOut(){

if(!gameRunning) return

clearInterval(interval)
gameRunning = false

let win = betAmount * multiplier
addBalance(win)
updateBalance()

tg.HapticFeedback.notificationOccurred("success")

alert("Вы забрали " + win.toFixed(2) + " TON")

}

/* КРАШ */
function endGame(){

clearInterval(interval)
gameRunning = false

document.getElementById("multiplier").innerText = "CRASH"

tg.HapticFeedback.notificationOccurred("error")

}

/* РЕАЛЬНАЯ ФОРМУЛА CRASH */
function generateCrash(){
return Math.pow(1 - Math.random(), -1.2)
}

</script>

</body>
</html>
