<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crash X Style Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    background: #0b0b0b;
    font-family: 'Orbitron', sans-serif;
    color: #fff;
    overflow: hidden;
}

/* HEADER */
.header {
    display: flex;
    align-items: center;
    padding: 10px 20px;
}
.back-btn {
    background: none;
    border: none;
    color: #ff3b3b;
    font-size: 24px;
    cursor: pointer;
}
.username {
    font-size: 18px;
    font-weight: bold;
    color: #ff2b2b;
}

/* MAIN LAYOUT */
.crash-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px;
}

/* BALANCE */
.balance-box {
    background: #111;
    padding: 10px 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,0,0,0.3);
    box-shadow: 0 0 10px rgba(255,0,0,0.2);
}

/* MULTIPLIER */
.multiplier {
    font-size: 48px;
    color: #ff2b2b;
    text-shadow: 0 0 20px rgba(255,0,0,0.8);
}

/* GRAPH */
.canvas-container {
    position: relative;
    width: 350px;
    height: 420px;
    overflow: hidden;
    border-radius: 12px;
    border: 1px solid rgba(255,0,0,0.3);
    box-shadow: 0 0 15px rgba(255,0,0,0.2);
    background: #090909;
}
canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}

/* CONTROLS */
.bet-box {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}
.bet-input {
    width: 100px;
    padding: 10px;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    text-align: center;
}
.crash-btn {
    padding: 12px 20px;
    background: #ff2b2b;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    color: #fff;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
    cursor: pointer;
}

/* HISTORY */
.history {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 350px;
}
.history-item {
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
}
.h-red { background: #3a0000; color: #ff4d4d; }
.h-orange { background: #3a1f00; color: #ff9a2b; }
.h-green { background: #003a0a; color: #2bff88; }
</style>
</head>

<body>

<div class="header">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="username">CRASH X</div>
</div>

<div class="crash-container">

  <div class="balance-box">
    Баланс: <span id="balance">100.00</span> TON
  </div>

  <div class="multiplier" id="multiplier">1.00x</div>

  <div class="history" id="history"></div>

  <div class="canvas-container">
    <canvas id="graph"></canvas>
    <!-- Ракета рисуется внутри canvas -->
  </div>

  <div class="bet-box">
    <input class="bet-input" id="bet" value="5">
    <button class="crash-btn" onclick="startGame()">СТАВКА</button>
    <button class="crash-btn" onclick="cashOut()">ЗАБРАТЬ</button>
  </div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

/* BALANCE HANDLERS */
function getBalance(){ return Number(localStorage.getItem("balance")||100); }
function addBalance(a){ localStorage.setItem("balance", getBalance()+a); updateBalance(); }
function subtractBalance(a){ addBalance(-a); }
function updateBalance(){ document.getElementById("balance").innerText = getBalance().toFixed(2); }
updateBalance();

/* HISTORY */
let crashHistory=[];
function addCrashHistory(v){ crashHistory.push(v); if(crashHistory.length>20) crashHistory.shift(); renderCrashHistory(); }
function renderCrashHistory(){
  const el=document.getElementById("history"); el.innerHTML="";
  crashHistory.forEach(v=>{
    const item=document.createElement("div");
    item.classList.add("history-item");
    if(v<1.5)item.classList.add("h-red");
    else if(v<3)item.classList.add("h-orange");
    else item.classList.add("h-green");
    item.innerText=v.toFixed(2)+"x";
    el.appendChild(item);
  });
}

/* BACK */
function goBack(){ window.location.href="index.html"; }

/* GAME & GRAPH */
const canvas=document.getElementById("graph"), ctx=canvas.getContext("2d");

let rocketSprite = new Image();
rocketSprite.src="casesscreen/IMG_1044.png";

let gameRunning=false;
let multiplier=1;
let crashPoint=0;
let betAmount=0;
let curve=[];

// генерирует рандомный crash
function generateCrash(){ return Math.pow(1-Math.random(),-1.7); }

function startGame(){
  if(gameRunning) return;
  betAmount = Number(document.getElementById("bet").value);
  if(betAmount<=0 || betAmount>getBalance()){ alert("Недостаточно баланса"); return; }
  subtractBalance(betAmount);

  multiplier=1;
  crashPoint=generateCrash();
  curve=[];
  gameRunning=true;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  requestAnimationFrame(animate);
}

function animate(){
  if(!gameRunning) return;

  // наращивание множителя по кривой (плавное ускорение)
  multiplier += (crashPoint - multiplier) * 0.008 + Math.random()*0.002;
  curve.push(multiplier);
  if(curve.length>canvas.height) curve.shift();

  // очистка
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // рисуем шкалу множителей
  ctx.fillStyle="#fff";
  ctx.font="12px Orbitron";
  for(let m of [1,2,3,5,10]){
    let y = canvas.height - m*40;
    if(y>0){
      ctx.fillText(m+"x", 5, y);
      ctx.strokeStyle="rgba(255,255,255,0.1)";
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
    }
  }

  // график линии
  ctx.strokeStyle="#ff4444";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(canvas.width/2, canvas.height);
  for(let i=0;i<curve.length;i++){
    let x=i*(canvas.width/curve.length);
    let y=canvas.height - curve[i]*40;
    ctx.lineTo(x,y);
  }
  ctx.stroke();

  // рисуем ракету на последнем значении кривой
  let lastVal = curve[curve.length-1];
  let lastX = canvas.width/2;
  let lastY = canvas.height - lastVal*40;
  ctx.drawImage(rocketSprite, lastX-30, lastY-30, 60,60);

  document.getElementById("multiplier").innerText = lastVal.toFixed(2)+"x";

  if(lastVal>=crashPoint){
    endGame();
    return;
  }
  requestAnimationFrame(animate);
}

function cashOut(){
  if(!gameRunning) return;
  gameRunning=false;
  const win = betAmount * multiplier;
  addBalance(win);
  addCrashHistory(multiplier);
  tg.HapticFeedback.notificationOccurred("success");
  alert("Вы забрали " + win.toFixed(2) + " TON");
}

function endGame(){
  gameRunning=false;
  document.getElementById("multiplier").innerText="CRASH";
  addCrashHistory(multiplier);
  tg.HapticFeedback.notificationOccurred("error");
}
</script>
</body>
</html>
